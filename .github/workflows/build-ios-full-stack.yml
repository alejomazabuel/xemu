name: Build iOS Full Stack

on:
  push:
    branches-ignore:
      - master
    tags-ignore:
      - "v*"
    paths:
      - "ios-app/**"
      - "block/**"
      - "hw/**"
      - "include/block/**"
      - "include/hw/**"
      - "include/net/**"
      - "include/qemu/**"
      - "ui/**"
      - "net/**"
      - "include/ui/**"
      - "system/**"
      - "util/**"
      - "meson.build"
      - "meson_options.txt"
      - ".github/workflows/build-ios-full-stack.yml"
  workflow_dispatch:
    inputs:
      sim_destination:
        description: iOS Simulator destination for xcodebuild
        required: false
        default: "platform=iOS Simulator,name=iPhone 16,OS=latest"
        type: string
      run_device_build:
        description: Also run the generic iOS device build
        required: false
        default: true
        type: boolean
      min_ios_version:
        description: Minimum iOS version used for the dependency/core build
        required: false
        default: "17.0"
        type: string
      simulator_arch:
        description: Simulator architecture
        required: false
        default: auto
        type: choice
        options:
          - auto
          - arm64
          - x86_64
      sign_ipa:
        description: Export a signed IPA using Apple secrets
        required: false
        default: false
        type: boolean
      export_method:
        description: Apple export method for signed IPA
        required: false
        default: development
        type: choice
        options:
          - development
          - ad-hoc

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_ios_deps:
    name: Build iOS dependency bundle
    runs-on: macos-15
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build dependency prefixes
        env:
          X1BOX_IOS_MIN_VERSION: ${{ inputs.min_ios_version || '17.0' }}
          X1BOX_IOS_SIMULATOR_ARCH: ${{ inputs.simulator_arch || 'auto' }}
          X1BOX_IOS_DEPS_ARTIFACT_NAME: x1box-ios-deps
          X1BOX_IOS_DEPS_BUILD_ROOT: ${{ github.workspace }}/build/ios-deps
        run: bash ios-app/scripts/build-x1box-ios-deps.sh

      - name: Upload dependency artifact
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v4
        with:
          name: x1box-ios-deps
          path: |
            build/ios-deps/artifacts/x1box-ios-deps
            build/ios-deps/logs
          if-no-files-found: warn
          compression-level: 0

  build_embedded_core:
    name: Build embedded iOS core
    needs:
      - build_ios_deps
    runs-on: macos-15
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Set up Python tooling
        run: |
          python3 -m venv "$RUNNER_TEMP/x1box-ios-python"
          source "$RUNNER_TEMP/x1box-ios-python/bin/activate"
          python -m pip install --upgrade pip
          python -m pip install meson ninja pyyaml
          echo "$RUNNER_TEMP/x1box-ios-python/bin" >> "$GITHUB_PATH"

      - name: Download dependency artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          name: x1box-ios-deps
          path: build/ios-core-deps

      - name: Build embedded core xcframework
        env:
          X1BOX_IOS_DEPS_ROOT: ${{ github.workspace }}/build/ios-core-deps
          X1BOX_IOS_MIN_VERSION: ${{ inputs.min_ios_version || '17.0' }}
          X1BOX_IOS_SIMULATOR_ARCH: ${{ inputs.simulator_arch || 'auto' }}
          X1BOX_IOS_EMBEDDED_CORE_BUILD_ROOT: ${{ github.workspace }}/build/ios-embedded-core
        run: bash ios-app/scripts/build-x1box-embedded-core.sh

      - name: Upload embedded core artifact
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v4
        with:
          name: x1box-ios-embedded-core
          path: |
            build/ios-embedded-core/artifacts
            build/ios-embedded-core/logs
          if-no-files-found: warn
          compression-level: 0

  build_ios_app:
    name: Build iOS app shell with embedded core
    needs:
      - build_embedded_core
    runs-on: macos-15
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Show available simulators
        run: xcrun simctl list devices available

      - name: Prepare CI log directories
        run: mkdir -p build/ios-ci/logs build/ios-ci/packages build/ios-ci/signed build/ios-ci/results

      - name: Download embedded core artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          name: x1box-ios-embedded-core
          path: build/ios-embedded-core-download

      - name: Stage embedded core drop-in
        run: |
          bash ios-app/scripts/prepare-embedded-core-dropin.sh \
            build/ios-embedded-core-download \
            ios-app/EmbeddedCore

      - name: Prepare Apple signing assets
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_ipa }}
        shell: bash
        id: signing
        env:
          APPLE_SIGNING_CERT_BASE64: ${{ secrets.APPLE_SIGNING_CERT_BASE64 }}
          APPLE_SIGNING_CERT_PASSWORD: ${{ secrets.APPLE_SIGNING_CERT_PASSWORD }}
          APPLE_MOBILEPROVISION_BASE64: ${{ secrets.APPLE_MOBILEPROVISION_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_BUNDLE_ID: com.alejomazabuel.x1boxios
        run: |
          missing=()
          [[ -n "${APPLE_SIGNING_CERT_BASE64}" ]] || missing+=("APPLE_SIGNING_CERT_BASE64")
          [[ -n "${APPLE_SIGNING_CERT_PASSWORD}" ]] || missing+=("APPLE_SIGNING_CERT_PASSWORD")
          [[ -n "${APPLE_MOBILEPROVISION_BASE64}" ]] || missing+=("APPLE_MOBILEPROVISION_BASE64")
          [[ -n "${APPLE_TEAM_ID}" ]] || missing+=("APPLE_TEAM_ID")

          if [[ ${#missing[@]} -gt 0 ]]; then
            {
              echo "Apple signing secrets are missing in this fork."
              echo "Missing: ${missing[*]}"
            } | tee build/ios-ci/logs/setup-apple-signing.log
            exit 1
          fi

          bash ios-app/scripts/setup-apple-signing.sh \
            "${RUNNER_TEMP}/x1box-apple-signing.env" 2>&1 | tee build/ios-ci/logs/setup-apple-signing.log

      - name: Build and test iOS app
        env:
          SIM_DESTINATION: ${{ inputs.sim_destination || 'platform=iOS Simulator,name=iPhone 16,OS=latest' }}
          BUILD_ROOT: build/ios-ci
          RUN_DEVICE_BUILD: ${{ github.event_name != 'workflow_dispatch' && 'true' || (inputs.run_device_build == false && 'false' || 'true') }}
          ENABLE_SIGNED_EXPORT: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_ipa && 'true' || 'false' }}
          APPLE_EXPORT_METHOD: ${{ inputs.export_method || 'development' }}
          APPLE_TEAM_ID: ${{ steps.signing.outputs.team_id }}
          APPLE_PROFILE_NAME: ${{ steps.signing.outputs.profile_name }}
          APPLE_KEYCHAIN_PATH: ${{ steps.signing.outputs.keychain_path }}
          APPLE_SIGNED_BUNDLE_ID: ${{ steps.signing.outputs.bundle_id || 'com.alejomazabuel.x1boxios' }}
        run: bash ios-app/scripts/ci-build-ios.sh

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## X1 BOX iOS Full Stack"
            echo
            echo "- Branch: \`${{ github.ref_name }}\`"
            echo "- Minimum iOS: \`${{ inputs.min_ios_version || '17.0' }}\`"
            echo "- Simulator arch: \`${{ inputs.simulator_arch || 'auto' }}\`"
            echo "- Simulator destination: \`${{ inputs.sim_destination || 'platform=iOS Simulator,name=iPhone 16,OS=latest' }}\`"
            echo "- Device build enabled: \`${{ github.event_name != 'workflow_dispatch' && 'true' || (inputs.run_device_build == false && 'false' || 'true') }}\`"
            echo "- Signed IPA export enabled: \`${{ github.event_name == 'workflow_dispatch' && inputs.sign_ipa && 'true' || 'false' }}\`"
            echo "- Signed export method: \`${{ inputs.export_method || 'development' }}\`"
            echo "- Simulator smoke launch: included"
            echo "- Device archive output: \`build/ios-ci/packages/X1BoxiOS.xcarchive\`"
            echo "- Unsigned IPA output: \`build/ios-ci/packages/X1BoxiOS-unsigned.ipa\`"
            echo "- Signed IPA output: \`build/ios-ci/signed/export/X1BoxiOS.ipa\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload iOS CI artifact
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v4
        with:
          name: x1box-ios-ci
          path: |
            build/ios-ci/logs
            build/ios-ci/packages
            build/ios-ci/signed
            build/ios-ci/results
          if-no-files-found: warn
          compression-level: 0

      - name: Upload signed IPA artifact
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_ipa }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v4
        with:
          name: x1box-ios-signed-ipa
          path: |
            build/ios-ci/signed/export
            build/ios-ci/signed/X1BoxiOS-signed.xcarchive
          if-no-files-found: warn
          compression-level: 0
